name: Release

# Builds a GitHub Release with installers for Linux (AppImage, .deb, .rpm),
# Windows (.msi, .exe) and macOS (.dmg, universal Intel+Apple Silicon)
# whenever a `v*` tag is pushed. Runs on GitHub's own runners rather than a
# local machine specifically so the Linux build stays portable: it's built
# against an appropriately-aged toolchain (a strip/glibc too new for the
# AppImage tooling on the build machine can produce an AppImage that plain
# fails to build, or that only runs on distros as new as the build machine
# — see the commit that added this workflow).
#
# Neither the Windows nor the macOS build is code-signed (that needs a paid
# certificate this project doesn't have), so Windows SmartScreen and macOS
# Gatekeeper will both warn that the publisher is unverified on first launch
# until that's set up.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RapidTIMELAPSE ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
